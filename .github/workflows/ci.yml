name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip ".[api,test]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run default safe suite (opt-in tests are deselected)
        run: python -m pytest

  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip ".[api,test]"
      - name: Check formatting
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type-check package
        run: mypy src/ntp_anchor
      - name: Scan package for high-severity findings
        run: bandit -q --severity-level high -r src/ntp_anchor
      - name: Enforce branch coverage
        run: >-
          python -m pytest
          -m "not live_network and not privileged"
          --cov=ntp_anchor
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

  build-smoke:
    name: Build and clean-install smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test core-only source distribution
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$source_archive"
          python -m venv .smoke-core
          .smoke-core/bin/python -m pip install --upgrade pip
          .smoke-core/bin/python -m pip install "$source_archive"
          .smoke-core/bin/python -c "import ntp_anchor; print(ntp_anchor.__version__)"
          .smoke-core/bin/ntp-anchor-api --version
          set +e
          missing_output="$(.smoke-core/bin/ntp-anchor-api 2>&1)"
          missing_status=$?
          set -e
          test "$missing_status" -eq 3
          grep -F 'ntp-anchor[api]' <<<"$missing_output"
      - name: Smoke-test API-enabled wheel and ping route
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv .smoke-api
          .smoke-api/bin/python -m pip install --upgrade pip
          .smoke-api/bin/python -m pip install "${wheel}[api]" "httpx2>=2,<3"
          .smoke-api/bin/ntp-anchor-api --version
          .smoke-api/bin/python - <<'PY'
          from fastapi.testclient import TestClient

          from ntp_anchor import create_sync_manager
          from ntp_anchor.api import create_app

          manager = create_sync_manager()
          app = create_app(manager, lambda: None)
          with TestClient(app) as client:
              response = client.get("/ping")
              assert response.status_code == 200
              assert response.json() == {"status": "pong"}
          PY

