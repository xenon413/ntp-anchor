# Native, rootful Linux only. Grants clock-setting privileges on the Docker host.
services:
  ntp-anchor:
    image: ntp-anchor:privileged
    build:
      context: .
      target: privileged
    user: "0:0"
    cap_add:
      - SYS_TIME
    volumes:
      - ntp-anchor-privileged-logs:/var/log/ntp-anchor

volumes:
  ntp-anchor-privileged-logs:
