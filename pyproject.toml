[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntp-anchor"
version = "0.2.0"
description = "Cross-platform NTP time synchronization package"
readme = "README.md"

license = {file = "LICENSE"}
requires-python = ">=3.12.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ntplib>=0.4.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.142,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.53,<1"
]
test = [
    "bandit>=1.8,<2",
    "build>=1.3,<2",
    "httpx2>=2,<3",
    "mypy>=1.18,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.15,<4",
    "ruff>=0.14,<1"
]

[project.scripts]
ntp-anchor-api = "ntp_anchor._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = '-ra -q -m "not live_network and not privileged"'
testpaths = [
    "tests"
]
markers = [
    "unit: Isolated tests with no real network or privileged operations.",
    "integration: Deterministic integration tests using local resources only.",
    "server_integration: Loopback-only API subprocess integration tests.",
    "live_network: Opt-in tests that contact non-loopback NTP servers.",
    "privileged: Opt-in tests permitted to change a disposable host clock."
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
